<!-- Visitor statistics: https://lukasboehnertwebsite.goatcounter.com -->
<script data-goatcounter="https://lukasboehnertwebsite.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<!-- Also count clicks on PDF links (paper, CV, syllabus); they appear in
     GoatCounter as events named after the file, e.g. JMP_LBoehnert.pdf -->
<script>
  function countPdfClick(e) {
    var a = e.target.closest && e.target.closest('a[href$=".pdf"]');
    if (a && window.goatcounter && window.goatcounter.count) {
      window.goatcounter.count({
        path: a.pathname.split('/').pop(),
        title: a.textContent,
        event: true
      });
    }
  }
  document.addEventListener('click', countPdfClick);
  document.addEventListener('auxclick', countPdfClick);  /* middle-click, new tab */
</script>
